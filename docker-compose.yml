# docker compose up --build   ->   http://localhost:8080  (demo@sweety.app / demo1234)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sweety:sweety@db:5432/sweety
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      # Recreates the demo user's readings on every start. Set to false to keep edits.
      SEED_DEMO: ${SEED_DEMO:-true}
      # Optional: enables the AI weekly check-in on the home screen.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:4000"

volumes:
  pgdata:
